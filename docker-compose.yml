services:
  postgres:
    image: postgres:16-alpine
    container_name: tenant_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tenant_domains
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tenant_domains"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tenant_net
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tenant_app
    environment:
      SERVER_PORT: "8080"
      ENV: "development"
      BASE_DOMAIN: "yourplatform.local"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/tenant_domains?sslmode=disable"
      DB_MAX_OPEN_CONNS: "25"
      DB_MAX_IDLE_CONNS: "10"
      DB_CONN_MAX_LIFETIME: "5m"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tenant_net
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: tenant_caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - tenant_net
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  tenant_net:
    driver: bridge
